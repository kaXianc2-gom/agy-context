name: Build & Verify

on:
  push:
    branches: [main, zh-CN]
  pull_request:
    branches: [main, zh-CN]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:en
      - run: node -e "import('node:fs').then(fs => { const p = JSON.parse(fs.readFileSync('plugin.json','utf8')); if (!p.name || !p.version) process.exit(1); console.log('Validated manifest:', p.name, p.version); })"
